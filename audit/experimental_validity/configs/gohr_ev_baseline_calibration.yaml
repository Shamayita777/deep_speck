# EV-BASELINE calibration (pilot) configuration
#
# CALIBRATION TIER - NON-EVIDENTIARY BY CONSTRUCTION.
# Purpose: estimate nuisance VARIANCE for the prospective power analysis.
# It runs the IDENTICAL frozen protocol to production (5 rounds, depth 10,
# 200 epochs, reference batch size / optimizer / LR schedule / reg_param,
# full 10M/1M/1M data), because a reduced-fidelity pilot would characterise
# a different experiment.
#
# HARD PROHIBITIONS (enforced in code, not convention):
#   * results are marked non_evidentiary=true and calibration=true;
#   * they may NEVER enter a confirmatory test, the primary-family Holm
#     correction, or the integration ledger as evidence;
#   * they may NEVER be used to choose epsilon - epsilon is a
#     scientific-consequence margin, not an observed-effect quantity;
#   * this output_dir is mode-locked and may never hold production results.
# No hidden defaults: every scientifically relevant value is explicit here.
experiment_id: EV-BASELINE
run_mode: calibration

# Replicate plan - REQUIRES USER INPUT / pilot-derived value.
# The placeholder below is NOT a scientific recommendation; it must be
# replaced via the power-analysis procedure (framework/power.py) once
# a compute budget and target effect are supplied. Production runs
# must not proceed with an unexamined placeholder.
# PILOT SIZE - REQUIRES HUMAN DECISION. See docs/ev_calibration_plan.md:
# the precision/compute table shows what each n buys. 10-15 leaves sigma
# uncertain by a factor of ~2.2-2.7 (95% CI), hence required_n uncertain by ~5-7x.
requested_replicates: UNSPECIFIED_REQUIRES_PILOT_PRECISION_DECISION
minimum_valid_replicates: UNSPECIFIED_REQUIRES_PILOT_PRECISION_DECISION

base_model_seed: 90000   # disjoint from production seeds

# Frozen baseline (see gohr/baseline.py - this file must match it;
# validate_ev.py checks this consistency and fails closed on mismatch).
rounds: 5
depth: 10
epochs: 200
batch_size: 5000
train_size: 10000000
val_size: 1000000
confirmatory_test_size: 1000000
shuffle: true
optimizer: adam
lr_schedule: {high: 0.002, low: 0.0001, period: 10}

# --- frozen baseline restatement (checked field-by-field against
# --- gohr.baseline.BASELINE by run_ev.py::_check_baseline_consistency) ---
reg_param: 1.0e-05
checkpoint_monitor: val_loss
checkpoint_save_best_only: true
confirmatory_evaluation_protocol: final_epoch_weights

output_dir: results/calibration/ev_baseline
