# H-EV-SHUFFLE PAIRED calibration (pilot) configuration
#
# CALIBRATION TIER - NON-EVIDENTIARY BY CONSTRUCTION.
# Purpose: estimate nuisance VARIANCE for the prospective power analysis.
# It runs the IDENTICAL frozen protocol to production (5 rounds, depth 10,
# 200 epochs, reference batch size / optimizer / LR schedule / reg_param,
# full 10M/1M/1M data), because a reduced-fidelity pilot would characterise
# a different experiment.
#
# HARD PROHIBITIONS (enforced in code, not convention):
#   * results are marked non_evidentiary=true and calibration=true;
#   * they may NEVER enter a confirmatory test, the primary-family Holm
#     correction, or the integration ledger as evidence;
#   * they may NEVER be used to choose epsilon - epsilon is a
#     scientific-consequence margin, not an observed-effect quantity;
#   * this output_dir is mode-locked and may never hold production results.
experiment_id: H-EV-SHUFFLE
hypothesis_id: H-EV-SHUFFLE
run_mode: calibration

# Number of matched (dataset, model_seed) pairs. REQUIRES USER INPUT -
# to be set via framework/power.py's simulation-based sizing procedure
# once pilot variance (from EV-BASELINE/EV-NOISE) and a compute budget
# are known. Do not substitute a convenient number here.
# PAIRED pilot. Required because EV-BASELINE/EV-NOISE do NOT estimate
# sigma_Delta, the SD of the paired difference that actually drives power
# for the two primary hypotheses (docs/ev_calibration_plan.md, Gap 1).
requested_pairs: 10        # FROZEN predeclared pilot size (operational, not a
                           # claimed universal statistical minimum)
minimum_valid_pairs: 10    # no attrition allowance declared

# Prospective power analysis record (Issue 3, Round 6). Once a pilot
# has estimated noise_sd and epsilon has been confirmed, populate
# required_n via framework.power.required_replicates_for_power() and
# set minimum_valid_pairs >= required_n above. If minimum_valid_pairs
# is ever set BELOW required_n, scripts/run_ev.py refuses to run
# unless underpowered_justification is a non-empty, explicit string.
power_analysis:
  target_effect: null
  target_effect_source: null
  noise_sd: null
  target_power: 0.80
  required_n: null
  underpowered_justification: null

base_model_seed: 92000   # disjoint from production seeds

condition_a: {shuffle: true}
condition_b: {shuffle: false}

rounds: 5
depth: 10
epochs: 200
batch_size: 5000
train_size: 10000000
val_size: 1000000
confirmatory_test_size: 1000000
optimizer: adam
lr_schedule: {high: 0.002, low: 0.0001, period: 10}

multiplicity_family: ev_primary_family_v1
alpha: 0.05

# Practical-significance threshold (epsilon) - FROZEN at 0.01.
# It is NOT gated on, derived from, or validated against pilot spread:
# a practical-significance margin is a statement of scientific
# consequence, not of measurement noise. Pilot data estimate nuisance
# variance ONLY. See docs/statistical_plan.md ("Practical significance
# (epsilon) - FROZEN"). Never derive this from observed results.

# --- frozen baseline restatement (checked field-by-field against
# --- gohr.baseline.BASELINE by run_ev.py::_check_baseline_consistency) ---
reg_param: 1.0e-05
checkpoint_monitor: val_loss
checkpoint_save_best_only: true
confirmatory_evaluation_protocol: final_epoch_weights

# --- practical significance (FROZEN) ---
practical_threshold: 0.01
practical_threshold_predeclared: true
practical_threshold_justification: >
  epsilon = 0.01 absolute accuracy on the confirmatory test set. This is the
  audit-wide smallest effect treated as practically meaningful for this
  metric, and the SAME margin frozen for II-4, so the audit uses one
  predeclared practical-significance scale. It is a methodological judgment,
  NOT a literature-derived universal threshold, and it was NOT selected from
  or validated against pilot noise: pilot data estimate nuisance variance only.

output_dir: results/calibration/ev_shuffle
