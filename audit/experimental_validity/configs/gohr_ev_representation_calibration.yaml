# H-EV-REPRESENTATION calibration (pilot) configuration.
# CALIBRATION TIER - NON-EVIDENTIARY. Estimates sigma_Delta for prospective
# power planning only. Identical frozen protocol and identical Candidate-1
# permutation as production (hash-verified below).
experiment_id: H-EV-REPRESENTATION
hypothesis_id: H-EV-REPRESENTATION
run_mode: calibration

requested_pairs: 10        # FROZEN predeclared pilot size (operational, not a
                           # claimed universal statistical minimum)
minimum_valid_pairs: 10    # no attrition allowance declared; any failure means the
                           # pilot is re-planned, never a silently reduced denominator

power_analysis:
  target_effect: null
  target_effect_source: null
  noise_sd: null
  target_power: 0.80
  required_n: null
  underpowered_justification: null

base_model_seed: 93000   # disjoint from production seeds

condition_a: {representation: identity}
condition_b: {representation: candidate1}

# Permutation generation seed. This seed is used ONCE to generate the
# Candidate-1 permutation, which is then persisted, hashed, and frozen
# (see framework/firewall.py) before any confirmatory evaluation.
# Changing this value after freezing invalidates the frozen artifact.
permutation_generation_seed: 999

rounds: 5
depth: 10
epochs: 200
batch_size: 5000
train_size: 10000000
val_size: 1000000
confirmatory_test_size: 1000000
shuffle: true
optimizer: adam
lr_schedule: {high: 0.002, low: 0.0001, period: 10}

multiplicity_family: ev_primary_family_v1
alpha: 0.05

# --- frozen baseline restatement (checked field-by-field against
# --- gohr.baseline.BASELINE by run_ev.py::_check_baseline_consistency) ---
reg_param: 1.0e-05
checkpoint_monitor: val_loss
checkpoint_save_best_only: true
confirmatory_evaluation_protocol: final_epoch_weights

# --- practical significance (FROZEN) ---
practical_threshold: 0.01
practical_threshold_predeclared: true
practical_threshold_justification: >
  epsilon = 0.01 absolute accuracy on the confirmatory test set. This is the
  audit-wide smallest effect treated as practically meaningful for this
  metric, and the SAME margin frozen for II-4, so the audit uses one
  predeclared practical-significance scale. It is a methodological judgment,
  NOT a literature-derived universal threshold, and it was NOT selected from
  or validated against pilot noise: pilot data estimate nuisance variance only.

# --- Candidate-1 permutation binding ---
# Calibration MUST use the identical permutation as production, otherwise the
# pilot characterises a different intervention. The permutation is generated
# deterministically from permutation_generation_seed; run_ev.py verifies the
# realized permutation hash against this expected value and refuses on mismatch.
expected_candidate1_permutation_sha256: d7f9dd38585283e432fd565544ad82ecd83e459c66eedb05e0a2ad2d140cd427

output_dir: results/calibration/ev_representation
